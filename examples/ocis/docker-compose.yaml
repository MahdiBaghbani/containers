name: ocis

networks:
  ocis-net:
    name: ocis-net

volumes:
  ocis1-config:
  ocis1-data:
  ocis2-config:
  ocis2-data:

services:
  ocis-mitmproxy:
    image: "${MITMPROXY_IMAGE:-mitmproxy:v12.2.2}"
    container_name: ocis-mitmproxy.docker
    restart: "unless-stopped"
    security_opt:
      - no-new-privileges:true
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      ocis-net:
        aliases:
          - ocis-mitmproxy.docker
    environment:
      MITM_UI: "true"
      MITM_UI_SERVER_NAME: "ocis-mitmproxy.docker"
      MITM_UI_TLS_TERMINATION: "true"
      MITM_UI_TLS_CRT: "/tls/mitmproxy.crt"
      MITM_UI_TLS_KEY: "/tls/mitmproxy.key"
      MITM_CA_NAME: "${MITM_CA_NAME:-dockypody}"

  ocis1:
    image: "${OCIS_IMAGE:-ocis:v8.0.1}"
    container_name: ocis1.docker
    restart: "unless-stopped"
    security_opt:
      - no-new-privileges:true
    cap_add:
      - NET_BIND_SERVICE
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      ocis-net:
        aliases:
          - ocis1.docker
    healthcheck:
      test: ["CMD-SHELL", "curl -skf https://127.0.0.1/ >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    environment:
      OCIS_URL: "${OCIS1_URL:-https://ocis1.docker}"
      OCIS_LOG_LEVEL: "${OCIS_LOG_LEVEL:-info}"
      OCIS_LOG_COLOR: "${OCIS_LOG_PRETTY:-true}"
      OCIS_LOG_PRETTY: "${OCIS_LOG_PRETTY:-true}"
      OCIS_INSECURE: "${OCIS_INSECURE:-true}"
      OCIS_INIT: "${OCIS1_INIT:-true}"
      OCIS_ADMIN_PASSWORD: "${OCIS1_ADMIN_PASSWORD:-admin}"
      IDM_CREATE_DEMO_USERS: "${DEMO_USERS:-true}"
      OCIS_ADD_RUN_SERVICES: "${START_ADDITIONAL_SERVICES:-ocm}"
      DOCKYPODY_TLS_CERT_NAME: "${OCIS1_TLS_CERT_NAME:-ocis1}"
      # Direct demo/OTS mode: bind HTTPS on 443 without a reverse proxy.
      # The image still exposes 9200 for normal reverse-proxy deployments.
      PROXY_HTTP_ADDR: "0.0.0.0:443"
      PROXY_ENABLE_BASIC_AUTH: "true"
      NATS_NATS_HOST: "0.0.0.0"
      NATS_NATS_PORT: "9233"
      MICRO_REGISTRY_ADDRESS: "127.0.0.1:9233"
      GATEWAY_GRPC_ADDR: "0.0.0.0:9142"
      WEB_UI_CONFIG_FILE: "/etc/ocis/web-ui-config.json"
      FRONTEND_OCS_INCLUDE_OCM_SHAREES: "true"
      FRONTEND_OCS_LIST_OCM_SHARES: "true"
      FRONTEND_ENABLE_FEDERATED_SHARING_INCOMING: "true"
      FRONTEND_ENABLE_FEDERATED_SHARING_OUTGOING: "true"
      GRAPH_INCLUDE_OCM_SHAREES: "true"
      OCM_OCM_INVITE_MANAGER_INSECURE: "true"
      OCM_OCM_SHARE_PROVIDER_INSECURE: "true"
      OCM_OCM_STORAGE_PROVIDER_INSECURE: "true"
      HTTP_PROXY: "${OCIS_HTTP_PROXY:-http://ocis-mitmproxy.docker:8080}"
      HTTPS_PROXY: "${OCIS_HTTPS_PROXY:-http://ocis-mitmproxy.docker:8080}"
      NO_PROXY: "${OCIS1_NO_PROXY:-localhost,127.0.0.1,ocis-mitmproxy.docker,ocis1.docker}"
      OCM_PROVIDER_0_NAME: "ocis1.docker"
      OCM_PROVIDER_0_DOMAIN: "ocis1.docker"
      OCM_PROVIDER_0_FULL_NAME: "ocis1.docker provider"
      OCM_PROVIDER_0_ORGANIZATION: "ocis1.docker"
      OCM_PROVIDER_0_HOMEPAGE: "https://ocis1.docker"
      OCM_PROVIDER_0_DESCRIPTION: "ocis1.docker cloud storage"
      OCM_PROVIDER_0_OCM_HOST: "ocis1.docker"
      OCM_PROVIDER_0_OCM_ENDPOINT: "https://ocis1.docker/ocm/"
      OCM_PROVIDER_0_OCM_PATH: "/ocm/"
      OCM_PROVIDER_0_WEBDAV_HOST: "ocis1.docker"
      OCM_PROVIDER_0_WEBDAV_ENDPOINT: "https://ocis1.docker/dav/"
      OCM_PROVIDER_0_WEBDAV_PATH: "/dav/"
      OCM_PROVIDER_1_NAME: "ocis2.docker"
      OCM_PROVIDER_1_DOMAIN: "ocis2.docker"
      OCM_PROVIDER_1_FULL_NAME: "ocis2.docker provider"
      OCM_PROVIDER_1_ORGANIZATION: "ocis2.docker"
      OCM_PROVIDER_1_HOMEPAGE: "https://ocis2.docker"
      OCM_PROVIDER_1_DESCRIPTION: "ocis2.docker cloud storage"
      OCM_PROVIDER_1_OCM_HOST: "ocis2.docker"
      OCM_PROVIDER_1_OCM_ENDPOINT: "https://ocis2.docker/ocm/"
      OCM_PROVIDER_1_OCM_PATH: "/ocm/"
      OCM_PROVIDER_1_WEBDAV_HOST: "ocis2.docker"
      OCM_PROVIDER_1_WEBDAV_ENDPOINT: "https://ocis2.docker/dav/"
      OCM_PROVIDER_1_WEBDAV_PATH: "/dav/"
    volumes:
      - "ocis1-config:/etc/ocis"
      - "ocis1-data:/var/lib/ocis"

  ocis2:
    image: "${OCIS_IMAGE:-ocis:v8.0.1}"
    container_name: ocis2.docker
    restart: "unless-stopped"
    security_opt:
      - no-new-privileges:true
    cap_add:
      - NET_BIND_SERVICE
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      ocis-net:
        aliases:
          - ocis2.docker
    healthcheck:
      test: ["CMD-SHELL", "curl -skf https://127.0.0.1/ >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    environment:
      OCIS_URL: "${OCIS2_URL:-https://ocis2.docker}"
      OCIS_LOG_LEVEL: "${OCIS_LOG_LEVEL:-info}"
      OCIS_LOG_COLOR: "${OCIS_LOG_PRETTY:-true}"
      OCIS_LOG_PRETTY: "${OCIS_LOG_PRETTY:-true}"
      OCIS_INSECURE: "${OCIS_INSECURE:-true}"
      OCIS_INIT: "${OCIS2_INIT:-true}"
      OCIS_ADMIN_PASSWORD: "${OCIS2_ADMIN_PASSWORD:-admin}"
      IDM_CREATE_DEMO_USERS: "${DEMO_USERS:-true}"
      OCIS_ADD_RUN_SERVICES: "${START_ADDITIONAL_SERVICES:-ocm}"
      DOCKYPODY_TLS_CERT_NAME: "${OCIS2_TLS_CERT_NAME:-ocis2}"
      # Direct demo/OTS mode: bind HTTPS on 443 without a reverse proxy.
      # The image still exposes 9200 for normal reverse-proxy deployments.
      PROXY_HTTP_ADDR: "0.0.0.0:443"
      PROXY_ENABLE_BASIC_AUTH: "true"
      NATS_NATS_HOST: "0.0.0.0"
      NATS_NATS_PORT: "9233"
      MICRO_REGISTRY_ADDRESS: "127.0.0.1:9233"
      GATEWAY_GRPC_ADDR: "0.0.0.0:9142"
      WEB_UI_CONFIG_FILE: "/etc/ocis/web-ui-config.json"
      FRONTEND_OCS_INCLUDE_OCM_SHAREES: "true"
      FRONTEND_OCS_LIST_OCM_SHARES: "true"
      FRONTEND_ENABLE_FEDERATED_SHARING_INCOMING: "true"
      FRONTEND_ENABLE_FEDERATED_SHARING_OUTGOING: "true"
      GRAPH_INCLUDE_OCM_SHAREES: "true"
      OCM_OCM_INVITE_MANAGER_INSECURE: "true"
      OCM_OCM_SHARE_PROVIDER_INSECURE: "true"
      OCM_OCM_STORAGE_PROVIDER_INSECURE: "true"
      HTTP_PROXY: "${OCIS_HTTP_PROXY:-http://ocis-mitmproxy.docker:8080}"
      HTTPS_PROXY: "${OCIS_HTTPS_PROXY:-http://ocis-mitmproxy.docker:8080}"
      NO_PROXY: "${OCIS2_NO_PROXY:-localhost,127.0.0.1,ocis-mitmproxy.docker,ocis2.docker}"
      OCM_PROVIDER_0_NAME: "ocis1.docker"
      OCM_PROVIDER_0_DOMAIN: "ocis1.docker"
      OCM_PROVIDER_0_FULL_NAME: "ocis1.docker provider"
      OCM_PROVIDER_0_ORGANIZATION: "ocis1.docker"
      OCM_PROVIDER_0_HOMEPAGE: "https://ocis1.docker"
      OCM_PROVIDER_0_DESCRIPTION: "ocis1.docker cloud storage"
      OCM_PROVIDER_0_OCM_HOST: "ocis1.docker"
      OCM_PROVIDER_0_OCM_ENDPOINT: "https://ocis1.docker/ocm/"
      OCM_PROVIDER_0_OCM_PATH: "/ocm/"
      OCM_PROVIDER_0_WEBDAV_HOST: "ocis1.docker"
      OCM_PROVIDER_0_WEBDAV_ENDPOINT: "https://ocis1.docker/dav/"
      OCM_PROVIDER_0_WEBDAV_PATH: "/dav/"
      OCM_PROVIDER_1_NAME: "ocis2.docker"
      OCM_PROVIDER_1_DOMAIN: "ocis2.docker"
      OCM_PROVIDER_1_FULL_NAME: "ocis2.docker provider"
      OCM_PROVIDER_1_ORGANIZATION: "ocis2.docker"
      OCM_PROVIDER_1_HOMEPAGE: "https://ocis2.docker"
      OCM_PROVIDER_1_DESCRIPTION: "ocis2.docker cloud storage"
      OCM_PROVIDER_1_OCM_HOST: "ocis2.docker"
      OCM_PROVIDER_1_OCM_ENDPOINT: "https://ocis2.docker/ocm/"
      OCM_PROVIDER_1_OCM_PATH: "/ocm/"
      OCM_PROVIDER_1_WEBDAV_HOST: "ocis2.docker"
      OCM_PROVIDER_1_WEBDAV_ENDPOINT: "https://ocis2.docker/dav/"
      OCM_PROVIDER_1_WEBDAV_PATH: "/dav/"
    volumes:
      - "ocis2-config:/etc/ocis"
      - "ocis2-data:/var/lib/ocis"

  ocis-firefox:
    image: "${FIREFOX_IMAGE:-firefox:v150.0.0}"
    container_name: ocis-firefox.docker
    restart: "unless-stopped"
    security_opt:
      - no-new-privileges:true
    shm_size: "2g"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      ocis-net:
        aliases:
          - ocis-firefox.docker
    ports:
      - "${FIREFOX_UI_PORT:-5800}:6901"
    environment:
      OCM_FIREFOX_START_URL: "${FIREFOX_START_URL:-https://ocis1.docker/}"
    depends_on:
      ocis-mitmproxy:
        condition: service_started
      ocis1:
        condition: service_healthy
      ocis2:
        condition: service_healthy
