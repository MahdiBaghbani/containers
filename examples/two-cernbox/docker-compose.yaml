# Dev-only two-cernbox example stack. Validates a two-node CERNBox sender /
# receiver flow on one local Docker network. No production variant in this
# example.
name: two-cernbox

networks:
  two-cernbox-net:
    name: two-cernbox-net

services:
  mitm:
    image: "${MITMPROXY_IMAGE:-mitmproxy:v12.2.2}"
    container_name: mitmproxy.docker
    restart: "unless-stopped"
    security_opt:
      - no-new-privileges:true
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      two-cernbox-net:
        aliases:
          - mitmproxy.docker
    environment:
      MITM_UI: "true"
      MITM_UI_SERVER_NAME: "mitmproxy.docker"
      MITM_UI_TLS_TERMINATION: "true"
      MITM_UI_TLS_CRT: "/tls/mitmproxy.crt"
      MITM_UI_TLS_KEY: "/tls/mitmproxy.key"
      MITM_CA_NAME: "${MITM_CA_NAME:-dockypody}"

  # Per-instance IdPs: cernbox1 -> idp1.docker, cernbox2 -> idp2.docker. Two
  # separate Keycloak containers (same baked realm, different KC_HOSTNAME) so a
  # browser SSO session for instance 1 can never satisfy instance 2's login. The
  # baked idp.crt carries SANs for idp1.docker and idp2.docker.
  two-cernbox-idp1:
    image: "idp:${IMAGE_IDP}"
    container_name: two-cernbox-idp1
    restart: "unless-stopped"
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    networks:
      two-cernbox-net:
        aliases:
          - idp1.docker
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "admin"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "admin"
      KC_PROXY_HEADERS: "xforwarded"
      KC_HOSTNAME: "${IDP1_URL}"
      KC_HOSTNAME_ADMIN: "${IDP1_URL}"
      KC_HTTP_ENABLED: "true"
      KC_HTTPS_PORT: "${IDP_PORT:-443}"
      KC_HTTPS_CERTIFICATE_FILE: "/tls/idp.crt"
      KC_HTTPS_CERTIFICATE_KEY_FILE: "/tls/idp.key"
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_MANAGEMENT_SCHEME: "http"
      IDP_DOMAIN: "${IDP1_DOMAIN}"
      IDP_URL: "${IDP1_URL}"
    volumes:
      - "/etc/timezone:/etc/timezone:ro"
      - "/etc/localtime:/etc/localtime:ro"
      # - "${PWD}/volumes/data/idp1:/opt/keycloak/data"

  two-cernbox-idp2:
    image: "idp:${IMAGE_IDP}"
    container_name: two-cernbox-idp2
    restart: "unless-stopped"
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    networks:
      two-cernbox-net:
        aliases:
          - idp2.docker
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "admin"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "admin"
      KC_PROXY_HEADERS: "xforwarded"
      KC_HOSTNAME: "${IDP2_URL}"
      KC_HOSTNAME_ADMIN: "${IDP2_URL}"
      KC_HTTP_ENABLED: "true"
      KC_HTTPS_PORT: "${IDP_PORT:-443}"
      KC_HTTPS_CERTIFICATE_FILE: "/tls/idp.crt"
      KC_HTTPS_CERTIFICATE_KEY_FILE: "/tls/idp.key"
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_MANAGEMENT_SCHEME: "http"
      IDP_DOMAIN: "${IDP2_DOMAIN}"
      IDP_URL: "${IDP2_URL}"
    volumes:
      - "/etc/timezone:/etc/timezone:ro"
      - "/etc/localtime:/etc/localtime:ro"
      # - "${PWD}/volumes/data/idp2:/opt/keycloak/data"

  # Gateway container - handles HTTP services (ocdav, ocs, appprovider, etc.)
  two-cernbox-1-revad-gateway:
    image: "cernbox-revad:${IMAGE_CERNBOX_REVAD}"
    container_name: two-cernbox-1-revad-gateway
    restart: "unless-stopped"
    security_opt:
      - no-new-privileges:true
    networks:
      - two-cernbox-net
    environment:
      REVAD_CONTAINER_MODE: "gateway"
      DOMAIN: "${CERNBOX1_REVAD_DOMAIN}"
      REVAD_TLS_ENABLED: "${REVAD_TLS_ENABLED:-false}"
      REVAD_PROTOCOL: "${REVAD_PROTOCOL:-http}"
      REVAD_PORT: "${REVAD_PORT:-80}"
      REVAD_GATEWAY_HOST: "${CERNBOX1_REVAD_GATEWAY_HOST}"
      REVAD_GATEWAY_PORT: "${REVAD_GATEWAY_PORT}"
      REVAD_GATEWAY_PROTOCOL: "${REVAD_GATEWAY_PROTOCOL:-http}"
      REVAD_GATEWAY_GRPC_PORT: "${REVAD_GATEWAY_GRPC_PORT}"
      REVAD_LOG_LEVEL: "${REVAD_LOG_LEVEL}"
      REVAD_LOG_OUTPUT: "${REVAD_LOG_OUTPUT:-/var/log/revad.log}"
      REVAD_JWT_SECRET: "${REVAD_JWT_SECRET}"
      REVAD_OCMSHARES_JSON_FILE: "${REVAD_OCMSHARES_JSON_FILE:-/var/tmp/reva/shares.json}"
      WEB_DOMAIN: "${CERNBOX1_DOMAIN}"
      WEB_PROTOCOL: "${WEB_PROTOCOL:-https}"
      IDP_DOMAIN: "${IDP1_DOMAIN}"
      IDP_URL: "${IDP1_URL}"
      MESHDIR_DOMAIN: "${MESHDIR_DOMAIN:-meshdir.docker}"
      MESHDIR_URL: "${MESHDIR_URL:-}"
      OCM_DIRECTORY_SERVICE_URLS: "${OCM_DIRECTORY_SERVICE_URLS:-}"
      RCLONE_ENDPOINT: "${RCLONE_ENDPOINT:-http://rclone.docker}"
      REVAD_CONFIG_DIR: "${REVAD_CONFIG_DIR:-/etc/revad}"
      REVAD_DATAPROVIDER_LOCALHOME_HOST: "${CERNBOX1_REVAD_DATAPROVIDER_LOCALHOME_HOST}"
      REVAD_DATAPROVIDER_LOCALHOME_GRPC_PORT: "${REVAD_DATAPROVIDER_LOCALHOME_GRPC_PORT}"
      REVAD_DATAPROVIDER_OCM_HOST: "${CERNBOX1_REVAD_DATAPROVIDER_OCM_HOST}"
      REVAD_DATAPROVIDER_OCM_GRPC_PORT: "${REVAD_DATAPROVIDER_OCM_GRPC_PORT}"
      REVAD_DATAPROVIDER_SCIENCEMESH_HOST: "${CERNBOX1_REVAD_DATAPROVIDER_SCIENCEMESH_HOST}"
      REVAD_DATAPROVIDER_SCIENCEMESH_GRPC_PORT: "${REVAD_DATAPROVIDER_SCIENCEMESH_GRPC_PORT}"
      REVAD_AUTHPROVIDER_OIDC_HOST: "${CERNBOX1_REVAD_AUTHPROVIDER_OIDC_HOST}"
      REVAD_AUTHPROVIDER_OIDC_GRPC_PORT: "${REVAD_AUTHPROVIDER_OIDC_GRPC_PORT}"
      REVAD_AUTHPROVIDER_MACHINE_HOST: "${CERNBOX1_REVAD_AUTHPROVIDER_MACHINE_HOST}"
      REVAD_AUTHPROVIDER_MACHINE_GRPC_PORT: "${REVAD_AUTHPROVIDER_MACHINE_GRPC_PORT}"
      REVAD_AUTHPROVIDER_OCMSHARES_HOST: "${CERNBOX1_REVAD_AUTHPROVIDER_OCMSHARES_HOST}"
      REVAD_AUTHPROVIDER_OCMSHARES_GRPC_PORT: "${REVAD_AUTHPROVIDER_OCMSHARES_GRPC_PORT}"
      REVAD_AUTHPROVIDER_OCMSHARECODE_HOST: "${CERNBOX1_REVAD_AUTHPROVIDER_OCMSHARECODE_HOST}"
      REVAD_AUTHPROVIDER_OCMSHARECODE_GRPC_PORT: "${REVAD_AUTHPROVIDER_OCMSHARECODE_GRPC_PORT}"
      REVAD_AUTHPROVIDER_OCMEXCHANGEDTOKEN_HOST: "${CERNBOX1_REVAD_AUTHPROVIDER_OCMEXCHANGEDTOKEN_HOST}"
      REVAD_AUTHPROVIDER_OCMEXCHANGEDTOKEN_GRPC_PORT: "${REVAD_AUTHPROVIDER_OCMEXCHANGEDTOKEN_GRPC_PORT}"
      REVAD_AUTHPROVIDER_PUBLICSHARES_HOST: "${CERNBOX1_REVAD_AUTHPROVIDER_PUBLICSHARES_HOST}"
      REVAD_AUTHPROVIDER_PUBLICSHARES_GRPC_PORT: "${REVAD_AUTHPROVIDER_PUBLICSHARES_GRPC_PORT}"
      OCM_ENABLE_CODE_FLOW: "${OCM_ENABLE_CODE_FLOW:-false}"
      OCM_TIMEOUT: "${OCM_TIMEOUT:-10}"
      OCM_CLIENT_INSECURE: "${OCM_CLIENT_INSECURE:-true}"
      REVAD_SHAREPROVIDERS_HOST: "${CERNBOX1_REVAD_SHAREPROVIDERS_HOST}"
      REVAD_SHAREPROVIDERS_GRPC_PORT: "${REVAD_SHAREPROVIDERS_GRPC_PORT}"
      REVAD_GROUPUSERPROVIDERS_HOST: "${CERNBOX1_REVAD_GROUPUSERPROVIDERS_HOST}"
      REVAD_GROUPUSERPROVIDERS_GRPC_PORT: "${REVAD_GROUPUSERPROVIDERS_GRPC_PORT}"
      HTTP_PROXY: "${CERNBOX_HTTP_PROXY:-http://mitm:8080}"
      HTTPS_PROXY: "${CERNBOX_HTTPS_PROXY:-http://mitm:8080}"
      NO_PROXY: "${CERNBOX1_NO_PROXY}"
    depends_on:
      two-cernbox-idp1:
        condition: service_healthy
    volumes:
      - "/etc/timezone:/etc/timezone:ro"
      - "/etc/localtime:/etc/localtime:ro"
      - "${PWD}/volumes/cernbox1/config/reva-gateway:/etc/revad"
      - "${PWD}/volumes/cernbox1/data/reva/jsons:/var/tmp/reva"

  two-cernbox-1-revad-authprovider-oidc:
    image: "cernbox-revad:${IMAGE_CERNBOX_REVAD}"
    container_name: two-cernbox-1-revad-authprovider-oidc
