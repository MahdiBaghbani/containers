# Reusable workflow for orchestrating service builds
#
# GENERATED FILE - Do not edit manually
# Regenerate with: nu scripts/dockypody.nu ci workflow --target orchestrator

name: Build Orchestrator

on:
  workflow_call:
    inputs:
      push:
        description: "Push images to registry"
        required: false
        type: boolean
        default: false

# Service dependency graph:
#
#   cernbox-revad - depends on: common-tools, gaia, revad-base
#   cernbox-web - depends on: common-tools
#   common-tools - (root service)
#   cypress - (root service)
#   firefox - depends on: kasm-base
#   gaia - depends on: common-tools
#   idp - depends on: common-tools
#   kasm-base - (root service)
#   mitmproxy - depends on: common-tools
#   nextcloud - depends on: nextcloud-base
#   nextcloud-base - depends on: common-tools
#   nextcloud-contacts - depends on: common-tools, nextcloud
#   opencloudmesh-go - depends on: common-tools
#   revad-base - depends on: common-tools
#

jobs:
  build_cernbox_revad:
    name: cernbox-revad
    needs:
      - build_common_tools
      - build_gaia
      - build_revad_base
    uses: ./.github/workflows/build-service.yml
    with:
      service: cernbox-revad
      push: ${{ inputs.push }}
      dependencies: "revad-base,gaia,common-tools"
      disk_monitor_mode: basic
      prune_build_cache: true

  build_cernbox_web:
    name: cernbox-web
    needs:
      - build_common_tools
    uses: ./.github/workflows/build-service.yml
    with:
      service: cernbox-web
      push: ${{ inputs.push }}
      dependencies: "common-tools"
      disk_monitor_mode: basic
      prune_build_cache: true

  build_common_tools:
    name: common-tools
    uses: ./.github/workflows/build-service.yml
    with:
      service: common-tools
      push: ${{ inputs.push }}
      dependencies: ""
      disk_monitor_mode: basic
      prune_build_cache: true

  build_cypress:
    name: cypress
    uses: ./.github/workflows/build-service.yml
    with:
      service: cypress
      push: ${{ inputs.push }}
      dependencies: ""
      disk_monitor_mode: basic
      prune_build_cache: true

  build_firefox:
    name: firefox
    needs:
      - build_kasm_base
    uses: ./.github/workflows/build-service.yml
    with:
      service: firefox
      push: ${{ inputs.push }}
      dependencies: "kasm-base"
      disk_monitor_mode: basic
      prune_build_cache: true

  build_gaia:
    name: gaia
    needs:
      - build_common_tools
    uses: ./.github/workflows/build-service.yml
    with:
      service: gaia
      push: ${{ inputs.push }}
      dependencies: "common-tools"
      disk_monitor_mode: basic
      prune_build_cache: true

  build_idp:
    name: idp
    needs:
      - build_common_tools
    uses: ./.github/workflows/build-service.yml
    with:
      service: idp
      push: ${{ inputs.push }}
      dependencies: "common-tools"
      disk_monitor_mode: basic
      prune_build_cache: true

  build_kasm_base:
    name: kasm-base
    uses: ./.github/workflows/build-service.yml
    with:
      service: kasm-base
      push: ${{ inputs.push }}
      dependencies: ""
      disk_monitor_mode: basic
      prune_build_cache: true

  build_mitmproxy:
    name: mitmproxy
    needs:
      - build_common_tools
    uses: ./.github/workflows/build-service.yml
    with:
      service: mitmproxy
      push: ${{ inputs.push }}
      dependencies: "common-tools"
      disk_monitor_mode: basic
      prune_build_cache: true

  build_nextcloud:
    name: nextcloud
    needs:
      - build_nextcloud_base
    uses: ./.github/workflows/build-service.yml
    with:
      service: nextcloud
      push: ${{ inputs.push }}
      dependencies: "common-tools,nextcloud-base"
      disk_monitor_mode: basic
      prune_build_cache: true

  build_nextcloud_base:
    name: nextcloud-base
    needs:
      - build_common_tools
    uses: ./.github/workflows/build-service.yml
    with:
      service: nextcloud-base
      push: ${{ inputs.push }}
      dependencies: "common-tools"
      disk_monitor_mode: basic
      prune_build_cache: true

  build_nextcloud_contacts:
    name: nextcloud-contacts
    needs:
      - build_common_tools
      - build_nextcloud
    uses: ./.github/workflows/build-service.yml
    with:
      service: nextcloud-contacts
      push: ${{ inputs.push }}
      dependencies: "nextcloud-base,nextcloud,common-tools"
      disk_monitor_mode: basic
      prune_build_cache: true

  build_opencloudmesh_go:
    name: opencloudmesh-go
    needs:
      - build_common_tools
    uses: ./.github/workflows/build-service.yml
    with:
      service: opencloudmesh-go
      push: ${{ inputs.push }}
      dependencies: "common-tools"
      disk_monitor_mode: basic
      prune_build_cache: true

  build_revad_base:
    name: revad-base
    needs:
      - build_common_tools
    uses: ./.github/workflows/build-service.yml
    with:
      service: revad-base
      push: ${{ inputs.push }}
      dependencies: "common-tools"
      disk_monitor_mode: basic
      prune_build_cache: true

  build_complete:
    name: Build Complete
    needs:
      - build_cernbox_revad
      - build_cernbox_web
      - build_common_tools
      - build_cypress
      - build_firefox
      - build_gaia
      - build_idp
      - build_kasm_base
      - build_mitmproxy
      - build_nextcloud
      - build_nextcloud_base
      - build_nextcloud_contacts
      - build_opencloudmesh_go
      - build_revad_base
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Clean up shard artifacts
        uses: geekyeggo/delete-artifact@v5
        with:
          name: shard-*
          failOnError: false

      - name: All builds completed
        run: echo "Build orchestration finished"

  ghcr_purge:
    name: GHCR Purge Stale Versions
    needs:
      - build_cernbox_revad
      - build_cernbox_web
      - build_common_tools
      - build_cypress
      - build_firefox
      - build_gaia
      - build_idp
      - build_kasm_base
      - build_mitmproxy
      - build_nextcloud
      - build_nextcloud_base
      - build_nextcloud_contacts
      - build_opencloudmesh_go
      - build_revad_base
    if: ${{ inputs.push == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Nushell
        env:
          NU_VERSION: 0.108.0
        run: |
          curl -fsSL -o /tmp/nu.tar.gz "https://github.com/nushell/nushell/releases/download/0.108.0/nu-0.108.0-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p /tmp/nu
          tar -xzf /tmp/nu.tar.gz -C /tmp/nu --strip-components=1
          sudo mv /tmp/nu/nu /usr/local/bin/nu
          nu --version
      - name: Purge stale GHCR versions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: nu scripts/dockypody.nu ci ghcr-purge --dry-run=false --max-deletes=200
        # --max-deletes is a global budget across ALL services in this run.
        # Increase it or set to 0 to mean unlimited when many stale versions exist.
