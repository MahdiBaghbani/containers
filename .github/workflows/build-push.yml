# Build and push all services - Manual workflow for pushing to ghcr.io
#
# GENERATED FILE - Do not edit manually
# Regenerate with: nu scripts/dockypody.nu ci workflow --target build-push

name: Build and Push All

on:
  workflow_dispatch:

jobs:
  run_build_push_all:
    name: Build and Push All Services
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-orchestrator.yml
    with:
      push: true

  ghcr_purge:
    name: GHCR Purge Stale Versions
    needs:
      - run_build_push_all
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Nushell
        env:
          NU_VERSION: 0.113.1
        run: |
          curl -fsSL -o /tmp/nu.tar.gz "https://github.com/nushell/nushell/releases/download/${{ env.NU_VERSION }}/nu-${{ env.NU_VERSION }}-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p /tmp/nu
          tar -xzf /tmp/nu.tar.gz -C /tmp/nu --strip-components=1
          sudo mv /tmp/nu/nu /usr/local/bin/nu
          nu --version
      - name: Purge stale GHCR versions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: nu scripts/dockypody.nu ci ghcr-purge --dry-run=false --max-deletes=200
        # --max-deletes is a global budget across ALL services in this run.
        # Increase it or set to 0 to mean unlimited when many stale versions exist.
